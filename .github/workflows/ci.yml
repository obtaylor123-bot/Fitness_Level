name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx --yes expo-doctor
      # Known high findings are documented in SECURITY.md; fail immediately on critical findings.
      - run: npm audit --audit-level=critical
